services:
  garmin-app:
    build: .
    container_name: garmin-app
    env_file:
      - .env.prod
    volumes:
      - garmin_data:/app/data
    networks:
      - garmin_internal
      - caddy_proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  garmin_data:

networks:
  garmin_internal:
    driver: bridge
  caddy_proxy:
    external: true
